<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Sin conexión | PulpeAnálisis</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 1rem; padding: 0 1.5rem;
      text-align: center; background: #070714; color: #fff;
      font-family: Inter, system-ui, sans-serif;
    }
    .icono {
      width: 3.5rem; height: 3.5rem; border-radius: 1.25rem;
      background: rgba(124, 58, 237, 0.15);
      display: flex; align-items: center; justify-content: center; font-size: 1.6rem;
    }
    h1 { font-size: 1.25rem; margin: 0; }
    p { color: rgba(255, 255, 255, 0.45); font-size: .875rem; max-width: 26rem; margin: 0; line-height: 1.6; }
    button {
      margin-top: .5rem; background: #7C3AED; color: #fff; border: 0; cursor: pointer;
      font-weight: 600; font-size: .875rem; padding: .75rem 1.5rem; border-radius: 1rem;
      font-family: inherit;
    }
  </style>
</head>
<body>
  <div class="icono">📶</div>
  <h1>Sin conexión</h1>
  <p>
    PulpeAnálisis necesita internet para mostrarte ventas, inventario y fiados:
    son datos que cambian a cada rato y mostrártelos desactualizados te haría
    tomar decisiones equivocadas.
  </p>
  <p>Reconectate y volvé a intentar.</p>
  <button onclick="location.reload()">Reintentar</button>
</body>
</html>
