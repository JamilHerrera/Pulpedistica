# ── Identidad del proyecto en SonarCloud ────────────────────────────────────
# Estos dos valores tienen que coincidir EXACTAMENTE con los que muestra
# SonarCloud al crear el proyecto. Al importar un repo de GitHub, la clave
# suele quedar como <organizacion>_<repositorio>.
sonar.projectKey=JamilHerrera_Pulpedistica
sonar.organization=jamilherrera
sonar.projectName=PulpeAnálisis

# ── Qué se analiza ──────────────────────────────────────────────────────────
sonar.sources=src,api,middleware.ts
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts
sonar.sourceEncoding=UTF-8

# Código generado o de terceros: no es nuestro y ensucia las métricas.
sonar.exclusions=\
  node_modules/**,\
  dist/**,\
  coverage/**,\
  docs/**,\
  public/sw.js

# ── Cobertura ───────────────────────────────────────────────────────────────
# Sin esto, Sonar asume 0% de cobertura en el código nuevo y la puerta de
# calidad ("Sonar way" exige 80% en lo nuevo) se pone en rojo.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# ── Alcance de la cobertura ─────────────────────────────────────────────────
# Mismo criterio que vitest.config.ts: se mide la capa de lógica y quedan
# fuera las pantallas y hooks de React. Probarlos por unidad exige simular
# Supabase entero, y esas pruebas verifican que el simulacro devuelve lo que
# se le programó, no que la app funcione. Esa parte se valida con pruebas de
# navegador sobre el sitio real.
#
# Estos archivos SIGUEN analizándose en busca de bugs y code smells: solo se
# los excluye del cálculo de cobertura.
sonar.coverage.exclusions=\
  src/screens/**,\
  src/components/**,\
  src/hooks/**,\
  src/main.tsx,\
  src/AdminApp.tsx,\
  src/login.ts,\
  src/lib/supabase.ts,\
  src/lib/registrarSW.ts,\
  public/sw.js,\
  **/*.test.ts
